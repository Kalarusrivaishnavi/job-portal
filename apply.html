<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jobapply</title>
    <link rel="stylesheet" href="apply.css">
</head>
<body>
    <div class="form-container">
        <h2 id="jobtitle"></h2>
       <form id="applyform">
         <div class="form-group">
          <label for="username">Name:</label>
          <input type="text" id="username" placeholder="enter name" required>
         </div>
         <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="enter email" required>
         </div>
         <div class="form-group">
          <label for="number">Ph.no:</label>
          <input type="number" id="number" placeholder="enter number" required>
         </div>
         <button type="submit" id="submit">submit</button>
         <p id="success"> Application  Submitted successfully!</p>

        </form>
 
    </div>
    
    
   
    


<script src="app.js"></script>
</body>
</html>
