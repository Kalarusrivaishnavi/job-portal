<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job portal</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>
    <h1>Job Portal</h1>
    <p>Find your dream job</p>
    <div class="jobs">
       <div class="job-card"> 
        <h3>Frontend Developer</h3>
        <p>ABC Technologies</p>
        <p>Hyderabad</p>
        <button type="button" class="applybtn" data-role="Fronted Developer">Apply</button>
       </div> 
       <div class="job-card"> 
        <h3>Backend Developer</h3>
        <p>XYZ Solutions</p>
        <p>Banglore</p>
        <button type="button" class="applybtn" data-role="Backend Developer">Apply</button>
       </div>
       <div class="job-card"> 
        <h3>Full Stack Developer</h3>
        <p>TechSoft</p>
        <p>Remote</p>
        <button type="button" class="applybtn" data-role="Full Stack Developer">Apply</button>
       </div>
    </div>
    
    
    <script src="app.js"></script>
</body>
</html>
